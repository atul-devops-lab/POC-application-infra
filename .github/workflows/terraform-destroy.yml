name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm'
        required: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1

jobs:
  destroy-bootstrap:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "destroy" ]; then
            echo "Confirmation text didn't match — aborting."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::595981035245:role/github-actions-poc-infra-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete Ingress resources first (lets ALB Controller clean up ALBs)
        run: |
          aws eks update-kubeconfig --region ap-south-1 --name atul-devops-lab-eks
          kubectl delete ingress --all -A --ignore-not-found=true --timeout=120s || true
          echo "Waiting for ALB Controller to finish deleting load balancers..."
          sleep 90

      - name: Terraform Init
        working-directory: bootstrap
        run: terraform init

      - name: Terraform Destroy
        working-directory: bootstrap
        run: terraform destroy -auto-approve

  destroy-infrastructure:
    runs-on: ubuntu-latest
    needs: destroy-bootstrap
    environment: production
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "destroy" ]; then
            echo "Confirmation text didn't match — aborting."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::595981035245:role/github-actions-poc-infra-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
